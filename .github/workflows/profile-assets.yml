name: Refresh profile assets

on:
  schedule:
    # Daily at ~00:05 Warsaw time (22:05 UTC)
    - cron: "5 22 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-assets.yml
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare candidate directory
        run: mkdir -p generated

      - name: Generate GitHub stats candidate
        continue-on-error: true
        uses: vn7n24fzkq/github-profile-summary-cards@eda120aff352e7438ecf2b3a67e7eda2deb9fe2a
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false
          THEME: radical
          NAME: ${{ github.repository_owner }}

      - name: Apply profile palette to stats candidate
        shell: python
        run: |
          import re
          from pathlib import Path
          from xml.etree import ElementTree as ET

          candidate = Path("profile-summary-card-output/radical/3-stats.svg")

          if not candidate.exists():
              print("::warning::Stats candidate was not generated.")
              raise SystemExit(0)

          ET.register_namespace("", "http://www.w3.org/2000/svg")
          tree = ET.parse(candidate)
          root = tree.getroot()

          def set_style_fill(element, color):
              style = element.get("style", "")

              if re.search(r"fill:\s*#[0-9a-f]{6}", style, flags=re.IGNORECASE):
                  style = re.sub(
                      r"fill:\s*#[0-9a-f]{6}",
                      f"fill: {color}",
                      style,
                      flags=re.IGNORECASE,
                  )
              else:
                  style = f"{style.rstrip()} fill: {color};".lstrip()

              element.set("style", style)

          for element in root.iter():
              local_name = element.tag.rsplit("}", 1)[-1].lower()

              if local_name == "rect":
                  element.set("fill", "#0D1117")

                  if element.get("stroke") not in {None, "", "none"}:
                      element.set("stroke", "#FF6A00")
              elif local_name == "g":
                  if element.get("fill") not in {None, "", "none"}:
                      element.set("fill", "#FF6A00")

                  if "fill:" in element.get("style", "").lower():
                      set_style_fill(element, "#FF6A00")
              elif local_name == "text":
                  label = "".join(element.itertext()).strip()
                  normalized = "".join(label.split())

                  if normalized == "Stats":
                      set_style_fill(element, "#FF6A00")
                  elif label.endswith(":"):
                      set_style_fill(element, "#FDBA74")
                  elif normalized.isdigit():
                      set_style_fill(element, "#FFFFFF")

          tree.write(candidate, encoding="utf-8", xml_declaration=False)

      - name: Apply profile palette and gradient to details candidate
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree as ET

          candidate = Path("profile-summary-card-output/radical/0-profile-details.svg")

          if not candidate.exists():
              print("::warning::Profile details candidate was not generated.")
              raise SystemExit(0)

          ET.register_namespace("", "http://www.w3.org/2000/svg")
          tree = ET.parse(candidate)
          root = tree.getroot()
          namespace = "{http://www.w3.org/2000/svg}"

          definitions = root.find(f"{namespace}defs")
          if definitions is None:
              definitions = ET.Element(f"{namespace}defs")
              root.insert(0, definitions)

          gradient = ET.SubElement(
              definitions,
              f"{namespace}linearGradient",
              {"id": "chart_gradient", "x1": "0%", "y1": "0%", "x2": "0%", "y2": "100%"},
          )
          ET.SubElement(gradient, f"{namespace}stop", {"offset": "0%", "stop-color": "#8B5CF6", "stop-opacity": "0.85"})
          ET.SubElement(gradient, f"{namespace}stop", {"offset": "50%", "stop-color": "#FF6A00", "stop-opacity": "0.65"})
          ET.SubElement(gradient, f"{namespace}stop", {"offset": "100%", "stop-color": "#EF4444", "stop-opacity": "0.1"})

          for element in root.iter():
              local_name = element.tag.rsplit("}", 1)[-1].lower()
              elem_class = element.get("class", "")

              if "gpsc-chart" in elem_class:
                  for child in element:
                      if child.tag.rsplit("}", 1)[-1].lower() == "path":
                          child.set("fill", "url(#chart_gradient)")
                          child.set("stroke", "#FF6A00")
                          child.set("stroke-width", "1.5")
              elif local_name == "rect" and element.get("stroke") not in {None, "", "none"}:
                  element.set("stroke", "#FF6A00")
                  element.set("fill", "#0D1117")

          tree.write(candidate, encoding="utf-8", xml_declaration=False)

      - name: Fetch themed streak candidate
        continue-on-error: true
        run: |
          STREAK_URL="https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&card_width=340&background=0D1117&border=FF6A00&stroke=EA580C&ring=EF4444&fire=FF6A00&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=FF6A00&sideLabels=FF6A00&dates=FDBA74&hide_border=false&disable_animations=true"

          for attempt in {1..5}; do
            echo "Attempt $attempt: Fetching streak candidate..."
            if curl --fail --location --silent --show-error \
              --output generated/github-streak.svg \
              "$STREAK_URL"; then
              if [ -s generated/github-streak.svg ] && grep -q "Total Contributions" generated/github-streak.svg; then
                echo "Streak candidate successfully fetched and verified."
                exit 0
              fi
              echo "Streak response did not contain expected content (error payload or rate-limited). Retrying..."
            else
              echo "Curl failed to connect or fetch from streak server. Retrying..."
            fi
            rm -f generated/github-streak.svg
            sleep 15
          done

          echo "::warning::Streak candidate could not be fetched after 5 attempts. Preserving existing asset."

      - name: Apply profile gradient to streak candidate
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree as ET

          candidate = Path("generated/github-streak.svg")

          if not candidate.exists():
              print("::warning::Streak candidate was not generated.")
              raise SystemExit(0)

          ET.register_namespace("", "http://www.w3.org/2000/svg")
          ET.register_namespace("xlink", "http://www.w3.org/1999/xlink")

          tree = ET.parse(candidate)
          root = tree.getroot()
          namespace = "{http://www.w3.org/2000/svg}"
          definitions = root.find(f"{namespace}defs")

          if definitions is None:
              definitions = ET.Element(f"{namespace}defs")
              root.insert(0, definitions)

          for existing in list(definitions):
              if existing.get("id") == "fire_ring":
                  definitions.remove(existing)

          gradient = ET.SubElement(
              definitions,
              f"{namespace}linearGradient",
              {"id": "fire_ring", "x1": "0%", "y1": "0%", "x2": "100%", "y2": "100%"},
          )

          for offset, color in (
              ("0%", "#EF4444"),
              ("50%", "#FF6A00"),
              ("100%", "#FACC15"),
          ):
              ET.SubElement(
                  gradient,
                  f"{namespace}stop",
                  {"offset": offset, "stop-color": color},
              )

          for element in root.iter():
              local_name = element.tag.rsplit("}", 1)[-1].lower()

              if local_name == "rect" and element.get("stroke") not in {None, "", "none"}:
                  element.set("stroke", "#FF6A00")
              elif local_name == "line":
                  element.set("stroke", "#EA580C")
              elif local_name == "circle" and element.get("stroke") not in {None, "", "none"}:
                  element.set("stroke", "url(#fire_ring)")
              elif local_name == "path" and element.get("fill") not in {None, "", "none"}:
                  element.set("fill", "#FF6A00")
              elif local_name == "text":
                  label = "".join(element.itertext()).strip()
                  normalized = "".join(label.split()).lower()

                  if normalized.isdigit():
                      element.set("fill", "#FFFFFF")
                  elif normalized in {
                      "totalcontributions",
                      "currentstreak",
                      "longeststreak",
                  }:
                      element.set("fill", "#FF6A00")
                  elif "present" in normalized or "-" in label:
                      element.set("fill", "#FDBA74")

          tree.write(candidate, encoding="utf-8", xml_declaration=False)

      - name: Generate activity graph candidate
        continue-on-error: true
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import json
          import math
          import os
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          token = os.environ.get("GITHUB_TOKEN")
          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                      weekday
                    }
                  }
                }
              }
            }
          }
          """

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query, "variables": {"login": "${{ github.repository_owner }}"}}).encode("utf-8"),
              headers={"Authorization": f"Bearer {token}", "User-Agent": "GitHub-Action"},
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode("utf-8"))

              days = []
              for week in data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]:
                  for day in week["contributionDays"]:
                      days.append(day)

              last_31 = days[-31:]

              width = 840
              height = 360
              margin_left = 65
              margin_right = 40
              margin_top = 80
              margin_bottom = 50

              plot_w = width - margin_left - margin_right
              plot_h = height - margin_top - margin_bottom

              raw_max = max(d["contributionCount"] for d in last_31)
              raw_max = max(raw_max, 4)
              step_val = math.ceil(raw_max / 4)
              max_val = step_val * 4

              total_last_31 = sum(d["contributionCount"] for d in last_31)

              def x_for(i):
                  return margin_left + (i / (len(last_31) - 1)) * plot_w

              def y_for(val):
                  return margin_top + plot_h - (val / max_val) * plot_h

              points = [(x_for(i), y_for(d["contributionCount"])) for i, d in enumerate(last_31)]

              path_d = f"M {points[0][0]:.1f} {points[0][1]:.1f}"
              for i in range(1, len(points)):
                  p0 = points[i - 1]
                  p1 = points[i]
                  cx1 = p0[0] + (p1[0] - p0[0]) / 2
                  cy1 = p0[1]
                  cx2 = p0[0] + (p1[0] - p0[0]) / 2
                  cy2 = p1[1]
                  path_d += f" C {cx1:.1f} {cy1:.1f}, {cx2:.1f} {cy2:.1f}, {p1[0]:.1f} {p1[1]:.1f}"

              area_d = path_d + f" L {points[-1][0]:.1f} {margin_top + plot_h:.1f} L {points[0][0]:.1f} {margin_top + plot_h:.1f} Z"

              svg = f"""<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width} {height}" width="{width}" height="{height}">
                <defs>
                  <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
                    <stop offset="45%" stop-color="#FF6A00" stop-opacity="0.45"/>
                    <stop offset="100%" stop-color="#0D1117" stop-opacity="0.05"/>
                  </linearGradient>
                  <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#8B5CF6"/>
                    <stop offset="50%" stop-color="#FF6A00"/>
                    <stop offset="100%" stop-color="#EF4444"/>
                  </linearGradient>
                </defs>

                <!-- Background -->
                <rect width="{width}" height="{height}" rx="6" fill="#0D1117" stroke="#FF6A00" stroke-width="1.5"/>

                <!-- Title & Subtitle -->
                <text x="{margin_left}" y="38" fill="#FF6A00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
                  ${{ github.repository_owner }} GitHub Activity
                </text>
                <text x="{margin_left}" y="58" fill="#FDBA74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
                  Daily Contributions (Last 31 Days · Total: {total_last_31})
                </text>
              """

              grid_steps = 4
              for step in range(grid_steps + 1):
                  val = step * step_val
                  y = margin_top + plot_h - (step / grid_steps) * plot_h
                  svg += f"""  <line x1="{margin_left}" y1="{y:.1f}" x2="{width - margin_right}" y2="{y:.1f}" stroke="#30363D" stroke-width="1" stroke-dasharray="3,3"/>
                <text x="{margin_left - 12}" y="{y + 4:.1f}" text-anchor="end" fill="#FDBA74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">{val}</text>
              """

              svg += f"""  <path d="{area_d}" fill="url(#areaGradient)"/>
                <path d="{path_d}" fill="none" stroke="url(#lineGradient)" stroke-width="2.5"/>
              """

              for i, d in enumerate(last_31):
                  pt = points[i]
                  dt = datetime.strptime(d["date"], "%Y-%m-%d")
                  date_str = dt.strftime("%d %b") if (i % 3 == 0 or i == len(last_31) - 1) else ""

                  if d["contributionCount"] > 0:
                      svg += f"""  <circle cx="{pt[0]:.1f}" cy="{pt[1]:.1f}" r="4" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5"/>\n"""
                  else:
                      svg += f"""  <circle cx="{pt[0]:.1f}" cy="{pt[1]:.1f}" r="2.5" fill="#30363D"/>\n"""

                  if date_str:
                      svg += f"""  <text x="{pt[0]:.1f}" y="{margin_top + plot_h + 20}" text-anchor="middle" fill="#FDBA74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">{date_str}</text>\n"""

              svg += "</svg>\n"

              Path("generated").mkdir(parents=True, exist_ok=True)
              with open("generated/github-activity-graph.svg", "w", encoding="utf-8") as f:
                  f.write(svg)
          except Exception as error:
              print(f"::warning::Activity graph generation failed: {error}")

      - name: Upload candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-asset-candidates
          path: |
            profile-summary-card-output/radical/0-profile-details.svg
            profile-summary-card-output/radical/3-stats.svg
            generated/github-streak.svg
            generated/github-activity-graph.svg
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

  publish:
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download candidates
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-asset-candidates
          path: candidates

      - name: Validate and promote candidates
        id: promote
        shell: python
        run: |
          import os
          import re
          import shutil
          from pathlib import Path
          from xml.etree import ElementTree as ET

          candidates = [
              (
                  "stats",
                  Path("candidates/profile-summary-card-output/radical/3-stats.svg"),
                  Path("assets/github-stats.svg"),
                  (
                      "Stats",
                      "Total Stars:",
                      "Total Commits:",
                      "Total PRs:",
                      "Total Issues:",
                      "Contributed to:",
                  ),
                  ("#0d1117", "#ff6a00", "#fdba74", "#ffffff"),
                  ("340", "200", "0 0 340 200"),
              ),
              (
                  "streak",
                  Path("candidates/generated/github-streak.svg"),
                  Path("assets/github-streak.svg"),
                  (
                      "Total Contributions",
                      "Current Streak",
                      "Longest Streak",
                  ),
                  (
                      "#ef4444",
                      "#ff6a00",
                      "#ea580c",
                      "#facc15",
                      "#fdba74",
                      "#ffffff",
                      "#0d1117",
                  ),
                  ("340px", "195px", "0 0 340 195"),
              ),
              (
                  "activity-graph",
                  Path("candidates/generated/github-activity-graph.svg"),
                  Path("assets/github-activity-graph.svg"),
                  (
                      "GitHub Activity",
                  ),
                  (
                      "#ef4444",
                      "#ff6a00",
                      "#8b5cf6",
                      "#fdba74",
                      "#ffffff",
                      "#0d1117",
                      "#30363d",
                  ),
                  ("840", "360", "0 0 840 360"),
              ),
              (
                  "profile-details",
                  Path("candidates/profile-summary-card-output/radical/0-profile-details.svg"),
                  Path("assets/github-profile-details.svg"),
                  (
                      "Zalesny123",
                  ),
                  (
                      "#0d1117",
                      "#ff6a00",
                      "#ef4444",
                      "#8b5cf6",
                      "#ffffff",
                  ),
                  ("700", "200", "0 0 700 200"),
              ),
          ]

          rejected_fragments = (
              "<!doctype",
              "<!entity",
              "javascript:",
              "data:",
              "@import",
              "<?xml-stylesheet",
              "something went wrong",
              "bad credentials",
              "rate limit exceeded",
          )
          rejected_elements = {
              "embed",
              "animate",
              "animatemotion",
              "animatetransform",
              "foreignobject",
              "iframe",
              "image",
              "object",
              "script",
              "set",
          }

          failed = []
          updated = []

          for (
              name,
              candidate,
              destination,
              markers,
              expected_colors,
              expected_dimensions,
          ) in candidates:
              try:
                  if not candidate.exists():
                      raise FileNotFoundError(f"candidate file '{candidate.name}' was not generated")

                  data = candidate.read_bytes()

                  if not 1_500 <= len(data) <= 1_000_000:
                      raise ValueError(f"unexpected size: {len(data)} bytes")

                  text = data.decode("utf-8")
                  lowered = text.lower()

                  if any(fragment in lowered for fragment in rejected_fragments):
                      raise ValueError("rejected content found")

                  if re.search(r"url\(\s*['\"]?(?!#)", lowered):
                      raise ValueError("external CSS resource found")

                  root = ET.fromstring(data)
                  normalized_rendered_text = "".join(
                      "".join(root.itertext()).split()
                  )

                  if root.tag.rsplit("}", 1)[-1].lower() != "svg":
                      raise ValueError("root element is not SVG")

                  expected_width, expected_height, expected_view_box = (
                      expected_dimensions
                  )

                  if (
                      root.get("width") != expected_width
                      or root.get("height") != expected_height
                      or root.get("viewBox") != expected_view_box
                  ):
                      raise ValueError(
                          "unexpected dimensions: "
                          f"width={root.get('width')}, "
                          f"height={root.get('height')}, "
                          f"viewBox={root.get('viewBox')}"
                      )

                  if any(
                      root.get(attribute)
                      for attribute in (
                          "clip-path",
                          "display",
                          "filter",
                          "mask",
                          "opacity",
                          "transform",
                          "visibility",
                      )
                  ):
                      raise ValueError("root SVG presentation override found")

                  for element in root.iter():
                      local_name = element.tag.rsplit("}", 1)[-1].lower()

                      if local_name in rejected_elements:
                          raise ValueError(f"rejected element: {local_name}")

                      if local_name == "style":
                          stylesheet = "".join(element.itertext())

                          if not re.fullmatch(
                              r"\s*\*\s*\{\s*font-family\s*:[^{};]+;?\s*\}\s*",
                              stylesheet,
                              flags=re.IGNORECASE,
                          ):
                              raise ValueError("unsupported stylesheet content")

                      for attribute, value in element.attrib.items():
                          attribute_name = attribute.rsplit("}", 1)[-1].lower()
                          value_lowered = value.strip().lower()

                          if attribute_name.startswith("on"):
                              raise ValueError(
                                  f"event attribute found: {attribute_name}"
                              )

                          if attribute_name == "filter":
                              raise ValueError("SVG filters are forbidden")

                          if attribute_name in {"display", "visibility"}:
                              raise ValueError(
                                  f"SVG {attribute_name} overrides are forbidden"
                              )

                          if attribute_name in {"fill-opacity", "opacity"}:
                              if value_lowered != "1":
                                  raise ValueError(
                                      f"invalid {attribute_name} value"
                                  )

                          if attribute_name == "stroke-opacity" and value_lowered not in {"0", "1"}:
                              raise ValueError("invalid stroke-opacity value")

                          if attribute_name in {"href", "src"} and not value_lowered.startswith("#"):
                              raise ValueError(
                                  f"external reference found: {attribute_name}"
                              )

                          if attribute_name == "style":
                              if any(
                                  token in value
                                  for token in ("/*", "*/", "\\", "{", "}", "@")
                              ):
                                  raise ValueError("unsupported inline style syntax")

                              for declaration in value.split(";"):
                                  if ":" not in declaration:
                                      continue

                                  property_name, property_value = declaration.split(":", 1)
                                  property_name = property_name.strip().lower()
                                  property_value = property_value.strip().lower()

                                  if property_name not in {
                                      "--gpsc-i",
                                      "--gpsc-w",
                                      "fill",
                                      "font-size",
                                      "isolation",
                                      "opacity",
                                  }:
                                      raise ValueError(
                                          f"unsupported inline property: {property_name}"
                                      )

                                  if property_name == "--gpsc-i" and not re.fullmatch(
                                      r"\d+", property_value
                                  ):
                                      raise ValueError("invalid --gpsc-i value")

                                  if property_name == "--gpsc-w" and not re.fullmatch(
                                      r"\d+(?:\.\d+)?px", property_value
                                  ):
                                      raise ValueError("invalid --gpsc-w value")

                                  if property_name == "font-size" and not re.fullmatch(
                                      r"\d+(?:\.\d+)?px", property_value
                                  ):
                                      raise ValueError("invalid inline font-size")

                                  if property_name == "isolation" and property_value != "isolate":
                                      raise ValueError("invalid isolation value")

                                  if property_name == "opacity" and property_value != "1":
                                      raise ValueError("invalid opacity value")

                                  if property_name not in {
                                      "color",
                                      "fill",
                                      "stop-color",
                                      "stroke",
                                  }:
                                      continue

                                  if "!important" in property_value or not re.fullmatch(
                                      r"#[0-9a-f]{6}|url\(#[a-z0-9_-]+\)|black|none|white|transparent|currentcolor",
                                      property_value,
                                  ):
                                      raise ValueError(
                                          f"unsupported inline {property_name} value"
                                      )

                          if attribute_name in {"color", "fill", "stop-color", "stroke"}:
                              if not re.fullmatch(
                                  r"#[0-9a-f]{6}|url\(#[a-z0-9_-]+\)|black|none|white|transparent|currentcolor",
                                  value_lowered,
                              ):
                                  raise ValueError(
                                      f"unsupported {attribute_name} value"
                                  )

                  missing = [
                      marker
                      for marker in markers
                      if "".join(marker.split()) not in normalized_rendered_text
                  ]
                  if missing:
                      raise ValueError(f"missing markers: {', '.join(missing)}")

                  missing_colors = [
                      color for color in expected_colors if color not in lowered
                  ]
                  if missing_colors:
                      raise ValueError(
                          f"missing profile colors: {', '.join(missing_colors)}"
                      )

                  svg_colors = set(
                      re.findall(r"#[0-9a-f]{6}", lowered)
                  )
                  unexpected_colors = sorted(
                      svg_colors.difference(expected_colors)
                  )

                  if unexpected_colors:
                      raise ValueError(
                          f"unexpected colors: {', '.join(unexpected_colors)}"
                      )

                  def color_of(element, property_name):
                      inline_values = []

                      for declaration in element.get("style", "").split(";"):
                          if ":" not in declaration:
                              continue

                          declared_property, declared_value = declaration.split(":", 1)
                          if declared_property.strip().lower() == property_name:
                              inline_values.append(declared_value.strip().lower())

                      if inline_values:
                          return inline_values[-1]

                      direct_color = element.get(property_name)
                      return direct_color.lower() if direct_color else None

                  def normalized_label(element):
                      return "".join(
                          "".join(element.itertext()).split()
                      ).lower()

                  elements = list(root.iter())
                  texts = [
                      element
                      for element in elements
                      if element.tag.rsplit("}", 1)[-1].lower() == "text"
                  ]
                  border = next(
                      (
                          element
                          for element in elements
                          if element.tag.rsplit("}", 1)[-1].lower() == "rect"
                          and color_of(element, "stroke") not in {None, "none"}
                      ),
                      None,
                  )

                  if border is None:
                      raise ValueError("card border not found")

                  if (
                      color_of(border, "fill") != "#0d1117"
                      or color_of(border, "stroke") != "#ff6a00"
                      or border.get("stroke-opacity") not in {None, "", "1"}
                  ):
                      raise ValueError("card border palette mismatch")

                  if name == "stats":
                      for element in texts:
                          label = normalized_label(element)
                          actual_color = color_of(element, "fill")

                          if label == "stats" and actual_color != "#ff6a00":
                              raise ValueError("stats title color mismatch")
                          if label.endswith(":") and actual_color != "#fdba74":
                              raise ValueError("stats label color mismatch")
                          if label.isdigit() and actual_color != "#ffffff":
                              raise ValueError("stats value color mismatch")

                  if name == "streak":
                      gradient = next(
                          (
                              element
                              for element in elements
                              if element.get("id") == "fire_ring"
                          ),
                          None,
                      )

                      if gradient is None or (
                          gradient.get("x1"),
                          gradient.get("y1"),
                          gradient.get("x2"),
                          gradient.get("y2"),
                      ) != ("0%", "0%", "100%", "100%"):
                          raise ValueError("streak gradient direction mismatch")

                      stop_colors = [
                          color_of(element, "stop-color")
                          for element in list(gradient)
                      ]
                      if stop_colors != ["#ef4444", "#ff6a00", "#facc15"]:
                          raise ValueError("streak gradient palette mismatch")

                      lines = [
                          element
                          for element in elements
                          if element.tag.rsplit("}", 1)[-1].lower() == "line"
                      ]
                      if not lines or any(
                          color_of(element, "stroke") != "#ea580c"
                          for element in lines
                      ):
                          raise ValueError("streak divider color mismatch")

                      circles = [
                          element
                          for element in elements
                          if element.tag.rsplit("}", 1)[-1].lower() == "circle"
                          and color_of(element, "stroke") not in {None, "none"}
                      ]
                      if len(circles) != 1 or color_of(circles[0], "stroke") != "url(#fire_ring)":
                          raise ValueError("streak ring gradient is missing")

                      for element in texts:
                          label = normalized_label(element)
                          actual_color = color_of(element, "fill")

                          if label.isdigit() and actual_color != "#ffffff":
                              raise ValueError("streak value color mismatch")
                          if label in {
                              "totalcontributions",
                              "currentstreak",
                              "longeststreak",
                          } and actual_color != "#ff6a00":
                              raise ValueError("streak label color mismatch")
                          if (
                              "present" in label or "-" in label
                          ) and actual_color != "#fdba74":
                              raise ValueError("streak date color mismatch")

                  destination.parent.mkdir(parents=True, exist_ok=True)

                  if not destination.exists() or destination.read_bytes() != data:
                      shutil.copyfile(candidate, destination)
                      updated.append(name)
                      print(f"Promoted {name}: {candidate} -> {destination}")
                  else:
                      print(f"{name} is already current")

              except Exception as error:
                  failed.append(name)
                  print(
                      f"::warning title={name} asset preserved::"
                      f"Candidate rejected: {error}"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"updated={','.join(updated)}", file=output)
              print(f"failed={','.join(failed)}", file=output)

      - name: Remove candidates
        if: always()
        run: rm -rf candidates

      - name: Commit valid asset updates
        run: |
          if git diff --quiet -- assets/github-stats.svg assets/github-streak.svg assets/github-activity-graph.svg assets/github-profile-details.svg; then
            echo "No asset changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-stats.svg assets/github-streak.svg assets/github-activity-graph.svg assets/github-profile-details.svg

          if git diff --cached --quiet; then
            echo "No staged asset changes."
            exit 0
          fi

          git commit -m "chore: refresh profile assets"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report stale assets
        if: steps.promote.outputs.failed != ''
        run: |
          echo "::warning::One or more candidates failed validation or could not be generated. Last valid assets were safely preserved: ${{ steps.promote.outputs.failed }}"
